<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Nusa Orders</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312241a'/%3E%3Cpath d='M32 10 54 32 32 54 10 32Z' fill='none' stroke='%23cfaa64' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --night:#0b1610;--forest:#12241a;--forest-2:#1b3526;--gold:#cfaa64;--gold-deep:#8d6a2c;--leaf:#2f6b46;
 --bg:#ffffff;--card:#ffffff;--soft:#f1f6f0;--soft-2:#e2ebe0;--ink:#18231c;--mute:#5f6a60;--line:#e4ebe2;
 --primary:#12241a;--on-primary:#f1eadc;--accent:#cfaa64;--on-accent:#1b1407;--bad:#a23a2a;--ok:#2f6b46;
 --serif:"Bodoni Moda","Bodoni 72",Didot,Georgia,serif;--sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
 --r:14px;--shadow:0 1px 0 rgba(18,36,26,.04),0 14px 34px -20px rgba(18,36,26,.35);
 color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1711;--card:#132119;--soft:#1a2b20;--soft-2:#22362a;--ink:#eee7d7;--mute:#9ca595;--line:#27382c;--primary:#cfaa64;--on-primary:#17120a;--gold-deep:#dfbb76;--ok:#8fd0a3;--bad:#e8907f;--shadow:0 14px 34px -20px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme=dark]{--bg:#0d1711;--card:#132119;--soft:#1a2b20;--soft-2:#22362a;--ink:#eee7d7;--mute:#9ca595;--line:#27382c;--primary:#cfaa64;--on-primary:#17120a;--gold-deep:#dfbb76;--ok:#8fd0a3;--bad:#e8907f;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
.serif{font-family:var(--serif);font-weight:500}
.hide{display:none!important}
.mute{color:var(--mute)}
.press{transition:transform .12s,background .2s,opacity .2s}
.press:active{transform:scale(.97)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:44px;padding:0 1.35rem;border-radius:99px;background:var(--primary);color:var(--on-primary);font-weight:600;font-size:.95rem;white-space:nowrap}
.btn:hover{opacity:.92}
.btn.gold{background:var(--accent);color:var(--on-accent)}
.btn.sm{min-height:38px;padding:0 1rem;font-size:.88rem}
.lnk{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;font-size:.92rem}
.lnk:hover{color:var(--gold-deep)}
.chip{display:inline-flex;align-items:center;padding:.1rem .55rem;border-radius:99px;font-size:.78rem;font-weight:600;line-height:1.5}
.chip.new{background:var(--accent);color:var(--on-accent)}
.chip.packed{background:var(--forest);color:#f1eadc}
.chip.done{background:var(--soft-2);color:var(--mute)}
.chip.ok{background:rgba(47,107,70,.14);color:var(--ok)}
.chip.warn{background:rgba(162,58,42,.12);color:var(--bad)}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg)}
.lock{width:100%;max-width:400px;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);animation:arrive .5s cubic-bezier(.2,.8,.2,1) both}
.lock.out{animation:leave .38s ease both}
.lock-top{background:var(--forest);color:#f1eadc;padding:34px 24px 28px;text-align:center}
.lock-top img{width:120px;height:auto}
.lock-top p{font-family:var(--serif);font-style:italic;color:var(--gold);margin-top:10px;font-size:1.05rem}
.lock form{padding:28px}
.lock h1{font-family:var(--serif);font-weight:500;font-size:1.7rem;margin-bottom:18px}
.fl{display:block;margin-bottom:18px}
.fl span{display:block;font-size:.82rem;font-weight:600;color:var(--mute);margin-bottom:2px}
.uin{width:100%;border:0;border-bottom:2px solid var(--line);background:transparent;padding:8px 0;font-size:1.1rem;outline:none;border-radius:0}
.uin:focus{border-color:var(--gold-deep)}
.pwrow{display:flex;gap:12px;align-items:flex-end}
.lock .btn{width:100%;margin-top:4px}
.err{color:var(--bad);font-size:.9rem;min-height:1.4em;margin-top:6px}
.demo{border-top:1px solid var(--line);margin-top:18px;padding-top:14px;font-size:.9rem;color:var(--mute)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--soft);padding:.1rem .45rem;border-radius:6px;color:var(--ink);font-size:.86rem}
@keyframes arrive{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes leave{to{opacity:0;transform:translateY(-10px) scale(.98)}}

/* header */
header.top{background:var(--forest);color:#f1eadc;position:sticky;top:0;z-index:20}
.hin{display:flex;align-items:center;flex-wrap:wrap;gap:6px 34px;padding:10px 20px 0;max-width:1480px;margin:0 auto}
.hin .logo{width:74px;height:auto;margin-bottom:8px}
#tabs{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{position:relative;padding:14px 14px 16px;color:rgba(241,234,220,.62);font-weight:500;white-space:nowrap}
#tabs button:hover,#tabs button.on{color:#f1eadc}
.cnt{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--gold);color:#1b1407;font-size:.72rem;font-weight:700;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.5)}}
.tabbar{position:absolute;bottom:0;left:0;height:3px;border-radius:3px 3px 0 0;background:var(--gold);transition:transform .35s cubic-bezier(.3,.7,.2,1),width .35s cubic-bezier(.3,.7,.2,1)}
.hr{margin-left:auto;display:flex;align-items:center;gap:20px;font-size:.86rem;padding-bottom:8px}
.hr a,.hr button{color:rgba(241,234,220,.7);text-decoration:none}
.hr a:hover,.hr button:hover{color:#f1eadc}
.sync{display:inline-flex;align-items:center;gap:8px;color:rgba(241,234,220,.6);font-size:.8rem}
.sync i{width:8px;height:8px;border-radius:50%;border:1.5px solid rgba(241,234,220,.6)}
@media(max-width:900px){.sync,.hr .wl{display:none}.hin{gap:0 16px}.hin .logo{width:60px}}

main{max-width:1480px;margin:0 auto;padding:24px 20px 80px}
#view{transition:opacity .14s,transform .14s}
#view.out{opacity:0;transform:translateY(6px)}

/* banners */
.ban{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding:14px 20px;border-radius:var(--r);margin-bottom:14px;animation:arrive .4s both}
.ban.gold{background:var(--accent);color:var(--on-accent)}
.ban.dark{background:var(--forest);color:#f1eadc}
.ban .t{flex:1;min-width:0}
.ban b{display:block;font-family:var(--serif);font-weight:600;font-size:1.15rem;line-height:1.25}
.ban span{font-size:.9rem;opacity:.82}
.ban .btn{background:var(--forest);color:#f1eadc}
.ban.dark .btn{background:#f1eadc;color:var(--forest)}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--forest);box-shadow:0 0 0 0 rgba(18,36,26,.4);animation:pl 1.8s infinite;flex:none}
@keyframes pl{70%{box-shadow:0 0 0 9px rgba(18,36,26,0)}}

/* week */
.wkhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;margin:6px 0 16px}
.wkhead h2{font-family:var(--serif);font-weight:500;font-size:1.6rem}
.wkhead h2 small{font-family:var(--sans);font-size:.95rem;color:var(--mute);margin-left:8px}
.wkctl{display:flex;align-items:center;gap:12px}
.arr{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:var(--card)}
.arr:hover{background:var(--soft)}
.arr svg{width:18px;height:18px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.board.from-left{animation:fl .32s cubic-bezier(.2,.8,.2,1)}
.board.from-right{animation:fr .32s cubic-bezier(.2,.8,.2,1)}
@keyframes fl{from{opacity:0;transform:translateX(-24px)}}
@keyframes fr{from{opacity:0;transform:translateX(24px)}}
.day{display:flex;flex-direction:column;min-height:250px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;transition:box-shadow .3s,transform .3s;animation:arrive .45s both}
.day:hover{box-shadow:0 1px 0 rgba(18,36,26,.04),0 20px 40px -18px rgba(18,36,26,.45)}
.day.today{border-color:var(--forest)}
.dh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:16px 20px;background:var(--soft);text-align:left;width:100%;border-bottom:1px solid var(--line)}
.day.today .dh{background:var(--forest);color:#f1eadc;border-color:var(--forest)}
.dh .wd{display:block;font-size:.88rem;font-weight:600;color:var(--mute)}
.day.today .dh .wd{color:rgba(241,234,220,.75)}
.dh .dd{display:block;font-family:var(--serif);font-size:2.3rem;line-height:1.05}
.dh .pt{text-align:right;font-size:.92rem;line-height:1.35}
.dh .pt b{display:block;font-size:1rem}
.tchip{display:inline-block;margin-left:6px;padding:0 6px;border-radius:6px;background:var(--gold);color:#1b1407;font-size:.72rem;font-weight:700;vertical-align:1px}
.place{padding:10px 20px;font-size:.86rem;color:var(--mute);border-bottom:1px solid var(--line)}
.ol{list-style:none;padding:0;flex:1}
.ol li+li{border-top:1px solid var(--line)}
.ob{display:block;width:100%;text-align:left;padding:14px 20px;transition:background .2s}
.ob:hover{background:var(--soft)}
.ob .r1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ob .nm{font-size:1.12rem;font-weight:700;line-height:1.25}
.ob .tt{font-weight:700;font-variant-numeric:tabular-nums}
.ob .its{margin-top:6px;font-size:1rem;line-height:1.45}
.ob .its span{color:var(--mute)}
.ob .meta{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.84rem;color:var(--mute)}
.ob.dim{opacity:.5}
.ob.dim .nm{text-decoration:line-through}
.note{margin-top:8px;padding:8px 12px;border-radius:10px;background:rgba(207,170,100,.2);font-size:.95rem}
.empty{padding:40px 20px;text-align:center;color:var(--mute)}
.addrow{border-top:1px solid var(--line);padding:13px 20px;text-align:left;font-weight:600;width:100%}
.addrow:hover{background:var(--soft)}
.foot{margin-top:18px;font-size:.9rem;color:var(--mute);display:flex;gap:18px;flex-wrap:wrap}

/* zoom */
.zoom{position:fixed;inset:0;z-index:40;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:24px 12px}
.scrim{position:fixed;inset:0;background:rgba(11,22,16,.5);backdrop-filter:blur(2px);animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.zbox{position:relative;width:100%;max-width:820px;margin:auto 0;background:var(--bg);border-radius:20px;border:1px solid var(--line);padding:28px;animation:zin .34s cubic-bezier(.2,.8,.2,1) both}
@keyframes zin{from{opacity:0;transform:translateY(16px) scale(.98)}}
.zbox .back{position:absolute;right:20px;top:20px}
.zt{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 20px;margin-top:8px}
.zt h2{font-family:var(--serif);font-weight:500;font-size:2rem;line-height:1.1}
.zt p{color:var(--mute);margin-top:4px}
.zt .acts{display:flex;align-items:center;gap:18px}
.ent{list-style:none;padding:0;margin-top:20px;display:grid;gap:12px}
.ent>li{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ent>li.isnew{border-color:var(--gold)}
.ent>li.dim{opacity:.6}
.ent>li.just{animation:flash 1s ease}
@keyframes flash{30%{background:rgba(207,170,100,.25)}}
.eb{display:flex;gap:18px;padding:18px 20px}
.eid{width:96px;flex:none;text-align:right}
.eid b{display:block;font-family:var(--serif);font-size:1.5rem;line-height:1;font-weight:500}
.eid span{font-size:.78rem;color:var(--mute)}
.ec{flex:1;min-width:0}
.ec .nm{font-size:1.4rem;font-weight:700;line-height:1.2;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.ec .its{margin-top:8px;font-size:1.12rem;line-height:1.5}
.ec .its span{color:var(--mute)}
.ec .meta{margin-top:10px;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.92rem;color:var(--mute)}
.ec .meta a{text-underline-offset:4px}
.ea{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--line);animation:fade .3s}
.ea .lnk:last-child{margin-left:auto}
.zx{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px 22px}

/* drawer */
.drawer{position:fixed;inset:0;z-index:50}
.sheet{position:absolute;right:0;top:0;height:100%;width:100%;max-width:470px;overflow-y:auto;background:var(--card);border-left:1px solid var(--line);padding:26px 24px 0;animation:sin .3s cubic-bezier(.2,.8,.2,1) both;box-shadow:-20px 0 50px -30px rgba(0,0,0,.5)}
@keyframes sin{from{transform:translateX(100%)}}
.drawer.out .sheet{animation:sout .18s ease both}
.drawer.out .scrim{animation:fade .18s reverse both}
@keyframes sout{to{transform:translateX(100%)}}
.sheet .close{position:absolute;right:18px;top:20px}
.sheet h2{font-family:var(--serif);font-weight:500;font-size:2rem;line-height:1.1;padding-right:60px}
.sheet .kick{font-size:.9rem;color:var(--mute)}
.lab{display:block;font-size:.82rem;font-weight:600;color:var(--mute);margin:20px 0 8px}
.segs{display:flex;flex-wrap:wrap;gap:6px}
.seg{padding:9px 14px;border-radius:99px;background:var(--soft);font-weight:500;font-size:.92rem}
.seg.on{background:var(--primary);color:var(--on-primary)}
.daysel{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.daysel button{padding:7px 0;border-radius:12px;background:var(--soft);text-align:center}
.daysel button small{display:block;font-size:.72rem;opacity:.75}
.daysel button b{font-size:1.1rem}
.daysel button.on{background:var(--primary);color:var(--on-primary)}
.daysel button.td b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.inl{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--mute);margin-top:10px}
.inl input{border:0;border-bottom:1px solid var(--line);background:transparent;padding:4px 0;outline:none}
.pick{border-top:1px solid var(--line)}
.prow{padding:10px 0;border-bottom:1px solid var(--line)}
.prow>b{display:block;font-weight:600}
.szs{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px}
.sz{display:flex;align-items:center;gap:8px;font-size:.9rem}
.sz .q{display:flex;align-items:center;gap:6px}
.sz .q button{width:30px;height:30px;border-radius:50%;background:var(--soft);font-size:1.1rem;line-height:1}
.sz .q button:hover{background:var(--soft-2)}
.sz .q b{min-width:16px;text-align:center}
.sz.has{color:var(--ink)}
.sz.has .q b{color:var(--gold-deep)}
.sumline{display:flex;justify-content:space-between;margin-top:10px;font-size:.92rem;color:var(--mute)}
.chk{display:flex;gap:12px;margin-top:20px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--forest);margin-top:2px}
.dock{position:sticky;bottom:0;margin:26px -24px 0;padding:16px 24px;border-top:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:16px}
.dock .ferr{position:absolute;left:24px;top:-38px;background:var(--bad);color:#fff;padding:5px 10px;border-radius:8px;font-size:.88rem;animation:arrive .25s both}
.sure{margin-left:auto;color:var(--bad);font-size:.92rem;text-decoration:underline;text-underline-offset:4px}
.sure.armed{background:var(--bad);color:#fff;text-decoration:none;padding:8px 12px;border-radius:99px;font-weight:600}
.big{font-family:var(--serif);font-size:4.6rem;line-height:1;margin-top:16px;font-variant-numeric:tabular-nums}
.bl{list-style:none;padding:0;margin-top:16px}
.bl li{border-top:1px solid var(--line);padding:12px 0}
.bl .r{display:flex;justify-content:space-between;font-family:var(--serif);font-size:1.25rem}
.bl small{color:var(--mute);font-size:.88rem}
.facts{margin-top:16px;border-top:1px solid var(--line)}
.facts div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.facts span{color:var(--mute)}
.facts b{font-weight:500;text-align:right}
.bars{margin-top:18px;display:grid;gap:10px}
.bars .br{display:grid;grid-template-columns:120px 1fr 64px;align-items:center;gap:10px;font-size:.92rem}
.track{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--forest);animation:growx .7s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
:root[data-theme=dark] .track i{background:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .track i{background:var(--gold)}}
@keyframes growx{from{transform:scaleX(0)}}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stats3 b{display:block;font-family:var(--serif);font-size:1.9rem;font-weight:500;line-height:1.1}
.stats3 span{font-size:.86rem;color:var(--mute)}

/* panels (catering, history, menu) */
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:var(--shadow)}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:14px 24px;margin-bottom:18px}
.ph h2{font-family:var(--serif);font-weight:500;font-size:1.9rem;line-height:1.1}
.ph p{color:var(--mute);font-size:.95rem;margin-top:4px;max-width:60ch}
.ph .acts{display:flex;gap:12px;align-items:center}
.H{font-family:var(--serif);font-weight:500;font-size:1.45rem;padding-bottom:6px;margin-bottom:14px;border-bottom:2px solid var(--forest)}
:root[data-theme=dark] .H{border-color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .H{border-color:var(--gold)}}

.cev{display:flex;gap:20px;padding:18px 20px}
.cdate{width:70px;flex:none;text-align:center;padding-top:2px}
.cdate small{display:block;font-size:.8rem;color:var(--mute);font-weight:600}
.cdate b{display:block;font-family:var(--serif);font-size:2.4rem;line-height:1;font-weight:500}
.cdate span{font-size:.82rem;color:var(--mute)}
.cev .ec .nm{font-size:1.3rem}
.cev .who{margin-top:4px;color:var(--mute)}
.cev .menu{margin-top:8px;font-size:1.02rem}
.qamt{font-family:var(--serif);font-size:1.5rem;white-space:nowrap}
.sect{margin-top:30px}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{padding:6px 14px;border-radius:99px;border:2px solid transparent;color:var(--mute);font-weight:500}
.pill.on{border-color:var(--forest);color:var(--ink)}
:root[data-theme=dark] .pill.on{border-color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .pill.on{border-color:var(--gold)}}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px}
.kpis b{display:block;font-family:var(--serif);font-weight:500;font-size:2.4rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpis span{font-size:.9rem;color:var(--mute)}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.vbars{display:flex;align-items:flex-end;gap:10px;height:170px;margin-top:12px;overflow-x:auto}
.vb{flex:1;min-width:52px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.vb b{font-size:.86rem;font-weight:600;margin-bottom:4px;white-space:nowrap}
.vb i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:var(--forest);animation:growy .7s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom}
.vb i.cur{background:var(--gold)}
:root[data-theme=dark] .vb i{background:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .vb i{background:var(--gold)}}
.vb span{font-size:.76rem;color:var(--mute);margin-top:5px;white-space:nowrap}
@keyframes growy{from{transform:scaleY(0)}}
table{width:100%;border-collapse:collapse;font-size:.94rem}
th{color:var(--mute);font-weight:600;text-align:right;padding:8px 0 8px 10px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;padding-left:0}
td{padding:9px 0 9px 10px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
td:first-child{font-weight:600}
td.bar{width:30%;padding-left:16px}
td.bar .track i{animation:none}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px}
@media(max-width:1000px){.cols3{grid-template-columns:1fr}}
.donut{display:flex;align-items:center;gap:22px}
.ring{position:relative;width:118px;height:118px;border-radius:50%;flex:none;animation:spin .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes spin{from{transform:rotate(-90deg);opacity:0}}
.ring div{position:absolute;inset:20px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;line-height:1.1}
.ring b{font-weight:700}
.ring small{display:block;font-size:.7rem;color:var(--mute)}
.leg{list-style:none;padding:0;flex:1;display:grid;gap:6px;font-size:.92rem}
.leg li{display:flex;align-items:center;gap:8px}
.leg i{width:12px;height:12px;border-radius:4px;flex:none}
.leg span{flex:1}
.srch{width:260px;max-width:100%;border:0;border-bottom:2px solid var(--forest);background:transparent;padding:6px 0;outline:none}
.nmb{font-family:var(--serif);font-size:1.12rem;font-weight:500;text-decoration:none}
.nmb:hover{text-decoration:underline;text-underline-offset:4px}

.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.mcard{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);animation:arrive .45s both}
.mph{position:relative;display:block;aspect-ratio:4/3;background:var(--soft);cursor:pointer;overflow:hidden}
.mph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.mph:hover img{transform:scale(1.03)}
.mph span{position:absolute;left:10px;bottom:10px;background:rgba(11,22,16,.75);color:#f1eadc;font-size:.78rem;padding:4px 10px;border-radius:99px;opacity:0;transition:opacity .2s}
.mph:hover span{opacity:1}
.mph em{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-style:normal}
.mph input{display:none}
.mb{padding:16px}
.mt{display:flex;align-items:center;gap:8px}
.mt input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--serif);font-size:1.4rem;outline:none;border-bottom:1px solid transparent}
.mt input:focus{border-color:var(--line)}
.rm{font-size:.8rem;color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.rm.armed{background:var(--bad);color:#fff;text-decoration:none;padding:3px 8px;border-radius:99px;font-weight:600}
.sh{display:grid;grid-template-columns:1fr 84px 46px 22px;gap:8px;font-size:.78rem;font-weight:600;color:var(--mute);border-bottom:1px solid var(--line);padding:12px 0 4px}
.srow{display:grid;grid-template-columns:1fr 84px 46px 22px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.srow.off{opacity:.55}
.srow input{width:100%;border:0;background:transparent;outline:none;font-size:1rem}
.srow .pr{display:flex;align-items:center}
.srow .pr span{color:var(--mute)}
.tg{position:relative;width:42px;height:24px;border-radius:99px;background:var(--forest);transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:21px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s cubic-bezier(.3,.7,.2,1)}
.tg.off{background:#b9b2a2}
.tg.off::after{left:3px}
.xx{color:var(--mute);font-size:1.15rem}
.xx:hover{color:var(--bad)}
.addsz{margin-top:8px;font-size:.88rem;color:var(--mute)}
.addsz:hover{color:var(--ink)}
.cat{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
.cat button{font-size:.78rem;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--mute);font-weight:600}
.cat button.on{background:var(--primary);color:var(--on-primary)}
.small{font-size:.9rem;color:var(--mute);margin-top:16px;max-width:70ch}

#toast{position:fixed;left:50%;bottom:24px;z-index:70;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--night);color:#f1eadc;padding:12px 18px;border-radius:12px;font-size:.95rem;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:.25s;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.sampleNote{margin-top:28px;font-size:.85rem;color:var(--mute);text-align:center}
.sampleNote button{text-decoration:underline;text-underline-offset:3px;color:var(--gold-deep);font-weight:600}

@media(max-width:640px){
 main{padding:16px 12px 70px}
 .hin{padding:8px 12px 0}
 .hr{gap:14px}
 .board{grid-template-columns:1fr}
 .zbox{padding:20px 16px;border-radius:16px}
 .eb{gap:12px;padding:16px}
 .eid{width:48px}
 .panel{padding:18px;border-radius:16px}
 .cev{gap:12px;padding:16px}
 .cdate{width:52px}
 .cdate b{font-size:2rem}
 .two{grid-template-columns:1fr}
 .bars .br{grid-template-columns:90px 1fr 54px}
 td.bar{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
header.top{background:#fff;color:var(--forest);border-bottom:1px solid var(--line);box-shadow:0 6px 20px -16px rgba(18,36,26,.4)}
.hin .logo{background:var(--forest);border-radius:12px;padding:6px 10px;margin:4px 0 12px}
#tabs button{color:#6b766c}#tabs button:hover,#tabs button.on{color:var(--forest)}
.hr a,.hr button,.sync{color:#5f6a60}.hr a:hover,.hr button:hover{color:var(--forest)}.sync i{border-color:var(--gold-deep)}
main{background:linear-gradient(180deg,#f4f8f2 0,#fff 260px)}
.day,.panel,.mcard,.ent>li{border-color:var(--line)}
.dh{background:linear-gradient(180deg,#f3f7f1,#eef4ec)}
.H{border-color:var(--gold)}
</style>
</head>

/* ---------- dates ---------- */
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2],12)}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
var TODAY=iso(new Date());
function monday(off){var d=parse(TODAY);var k=(d.getDay()+6)%7;d.setDate(d.getDate()-k+7*(off||0));return iso(d)}
function mondayOf(s){var d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)}
function weekOf(s){return Math.round((parse(mondayOf(s))-parse(monday(0)))/(7*864e5))}
function fd(s,o){return parse(s).toLocaleDateString("en-US",o)}
function short(s){return fd(s,{month:"short",day:"numeric"})}
function longd(s){return fd(s,{weekday:"long",month:"long",day:"numeric"})}
function wkd(s){return fd(s,{weekday:"long"})}
function money(n){n=Math.round(n*100)/100;return "$"+(n%1?n.toFixed(2):n.toLocaleString("en-US"))}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function plural(n,w){return n+" "+w+(n===1?"":"s")}

C.zoom=function(t){openZoom(t.dataset.k)};
C.unzoom=function(){closeZoom()};
C.dclose=function(){closeDrawer()};
C.pack=function(t){openDrawer(packHTML(t.dataset.k))};
C.totals=function(){openDrawer(totalsHTML())};
C.add=function(t){startForm(null,t.dataset.date,t.dataset.pt)};
C.edit=function(t){startForm(find(t.dataset.id))};
C.st=function(t){var o=find(t.dataset.id),s=t.dataset.s,pt=POINTS[o.point];o.status=s;save();flash(o.id);refreshZoom();render();
 toast(s==="packed"?o.name+" is packed":s==="done"?pt.done+": "+o.name:s==="new"?o.name+" is back to pack":"")};
C.paid=function(t){var o=find(t.dataset.id);o.paid=true;save();refreshZoom();render();toast(o.name+" marked paid")};
C.fpt=function(t){keepForm();var d=U.draft,k=t.dataset.k;d.point=k;if(k==="kitchen"||k==="market"){var m=mondayOf(d.date),n=addDays(m,(POINTS[k].dow+6)%7);d.date=n<TODAY?addDays(n,7):n}rerenderForm()};
C.fday=function(t){keepForm();U.draft.date=t.dataset.k;rerenderForm()};
C.fq=function(t){keepForm();var it=U.draft.items,s=t.dataset.s,q=(it[s]||0)+(+t.dataset.d);if(q<=0)delete it[s];else it[s]=q;U.ferr="";rerenderForm()};
C.fsave=function(){keepForm();var d=U.draft;
 if(!d.name.trim()){U.ferr="Add the customer's name.";rerenderForm();return}
 if(!Object.keys(d.items).length){U.ferr="Add at least one item.";rerenderForm();return}
 var items=Object.keys(d.items).map(function(s){return{s:s,q:d.items[s]}}),o;
 if(d.id){o=find(d.id);o.date=d.date;o.point=d.point;o.name=d.name.trim();o.phone=d.phone.trim();o.items=items;o.note=d.note.trim();o.paid=d.paid}
 else{o={id:S.nid++,date:d.date,point:d.point,name:d.name.trim(),phone:d.phone.trim(),items:items,note:d.note.trim(),source:"by hand",paid:d.paid,status:"new",placed:Date.now()};S.orders.push(o)}
 save();flash(o.id);var wasEdit=!!d.id;closeDrawer();
 U.week=weekOf(o.date);if(U.tab!=="Week"){U.tab="Week"}render();
 if(U.zoom){U.zoom=o.date+"|"+o.point;refreshZoom()}
 toast(wasEdit?"Saved "+o.name+"'s order":"Added "+o.name+", "+fd(o.date,{weekday:"short",month:"short",day:"numeric"}))};
C.fcancel=function(){var o=find(U.draft.id);o.status="cancelled";save();closeDrawer();refreshZoom();render();toast("Cancelled "+o.name+"'s order")};
C.fdel=function(){if(U.sure!=="del"){keepForm();arm("del");rerenderForm();return}var o=find(U.draft.id);S.orders=S.orders.filter(function(x){return x.id!==o.id});U.sure="";save();closeDrawer();refreshZoom();render();toast("Deleted "+o.name+"'s order")};
/* catering */
C.past=function(){U.showPast=!U.showPast;render()};
C.cst=function(t){var c=cfind(t.dataset.id);c.status=t.dataset.s;save();flash("c"+c.id);render();toast(c.event+": "+CST[c.status].toLowerCase())};
C.cedit=function(t){U.ferr="";U.sure="";U.cdraft=JSON.parse(JSON.stringify(cfind(t.dataset.id)));openDrawer(cformHTML(U.cdraft))};
C.cadd=function(){U.ferr="";U.sure="";U.cdraft={status:"new",mode:"Pickup",guests:20,date:addDays(TODAY,14),time:"12:00 pm"};openDrawer(cformHTML(U.cdraft))};
function rerenderC(){var sh=$(".sheet",layer),st=sh.scrollTop;sh.innerHTML='<button class="close lnk mute press" data-a="dclose">Close</button>'+cformHTML(U.cdraft);sh.scrollTop=st}
C.cseg=function(t){readCForm(U.cdraft);U.cdraft.status=t.dataset.s;rerenderC()};
C.csave=function(){var c=readCForm(U.cdraft);
 if(!c.event||!c.org){U.ferr="Add the event and who it is for.";rerenderC();return}
 if(c.status==="quoted"&&!c.quote){U.ferr="Add the quote amount first.";rerenderC();return}
 if(c.status==="new"&&c.quote)c.status="quoted";
 if(c.id){var i=S.catering.findIndex(function(x){return x.id===c.id});S.catering[i]=c}else{c.id=S.cid++;c.got=Date.now();S.catering.push(c)}
 save();flash("c"+c.id);closeDrawer();U.tab="Catering";render();toast(c.status==="quoted"?"Quote saved for "+c.org:"Saved "+c.event)};
C.cdel=function(){if(U.sure!=="cdel"){readCForm(U.cdraft);arm("cdel");rerenderC();return}S.catering=S.catering.filter(function(x){return x.id!==U.cdraft.id});U.sure="";save();closeDrawer();render();toast("Request deleted")};
/* history */
C.range=function(t){U.range=t.dataset.r;render()};
C.metric=function(t){U.metric=t.dataset.m;render()};
C.cust=function(t){openDrawer(custHTML(t.dataset.k))};
/* menu */
C.madd=function(){var id="p"+Date.now().toString(36);U.menu.push({id:id,name:"New item",cat:"classic",img:"",sizes:[{id:id+"-0",label:"Regular",price:10,on:true}]});render();var n=$('[data-f="pname"][data-id="'+id+'"]');if(n){n.focus();n.select();n.scrollIntoView({block:"center",behavior:"smooth"})}};
C.mrm=function(t){var id=t.dataset.id;if(U.sure!=="m"+id){arm("m"+id);render();return}U.menu=U.menu.filter(function(p){return p.id!==id});U.sure="";render()};
C.mcat=function(t){mfind(t.dataset.id).cat=t.dataset.c;render()};
C.mtog=function(t){var p=mfind(t.dataset.id);p.sizes.forEach(function(z){if(z.id===t.dataset.z)z.on=!z.on});render()};
C.mzrm=function(t){var p=mfind(t.dataset.id);p.sizes=p.sizes.filter(function(z){return z.id!==t.dataset.z});render()};
C.mzadd=function(t){var p=mfind(t.dataset.id);p.sizes.push({id:p.id+"-"+Date.now().toString(36),label:"Large",price:0,on:true});render()};
C.mdiscard=function(){U.menu=null;render()};
C.msave=function(){S.products=JSON.parse(JSON.stringify(U.menu));save();render();toast("Saved. The website shows it now.")};
document.addEventListener("input",function(e){
 var t=e.target,f=t.dataset&&t.dataset.f;
 if(t.id==="srch"){U.q=t.value;var pos=t.selectionStart;render();var s=$("#srch");s.focus();s.setSelectionRange(pos,pos);return}
 if(t.id==="cq"){var g=U.cdraft&&U.cdraft.guests,v=+t.value.replace(/[^\d.]/g,""),pp=$("#cpp");if(pp&&g)pp.textContent=v?money(v/g)+" per guest":"";return}
 if(!f||!U.menu)return;var p=mfind(t.dataset.id);if(!p)return;
 if(f==="pname")p.name=t.value;
 else{p.sizes.forEach(function(z){if(z.id===t.dataset.z){if(f==="zlabel")z.label=t.value;else z.price=+t.value}})}
 var dirty=JSON.stringify(U.menu)!==JSON.stringify(S.products),has=!!$('[data-a="msave"]');if(dirty!==has)rerenderMenuKeepFocus();
});
document.addEventListener("change",function(e){
 var t=e.target;
 if(t.id==="fdate"&&U.draft&&t.value){keepForm();U.draft.date=t.value;rerenderForm();return}
 if(t.dataset&&t.dataset.a==="mphoto"&&t.files&&t.files[0]){var id=t.dataset.id;shrink(t.files[0],function(d){mfind(id).photo=d;render()})}
});
document.addEventListener("keydown",function(e){if(e.key!=="Escape")return;if($(".drawer",layer))closeDrawer();else if(U.zoom)closeZoom()});

var signed=false;try{signed=!!localStorage.getItem("nusa-user")}catch(e){}
if(signed)appView();else loginView();
})();
</script>
</body>
</html>
